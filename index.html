<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New & Fahsai — Together</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--text:#2a2520;--muted:#8a8178;--accent:#a86652;--border:rgba(42,37,32,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Cormorant Garamond",serif}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.gallery-item{overflow:hidden;position:relative;cursor:pointer;border-radius:6px;box-shadow:0 10px 34px rgba(42,37,32,.12)}
.gallery-item img{transition:transform 1.2s cubic-bezier(.22,1,.36,1);width:100%;height:100%;object-fit:cover;display:block}
.gallery-item:hover img{transform:scale(1.07)}
.gallery-item .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(20,16,12,.18) 100%);opacity:0;transition:opacity .5s ease}
.gallery-item:hover .veil{opacity:1}
.stat-num{font-variant-numeric:tabular-nums}
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(20,16,12,.95);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s ease}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:88%;max-height:calc(100vh - 60px);object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.55);transform:scale(.9);transition:transform .55s cubic-bezier(.22,1,.36,1);border-radius:4px}
.lightbox.open img{transform:scale(1)}
.lb-btn{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s ease,transform .3s ease;z-index:5}
.lb-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.08)}
.divider{width:56px;height:1px;background:var(--accent);margin:0 auto}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.04;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hero-in{animation:heroIn 1.1s cubic-bezier(.22,1,.36,1) both}
.hero-in.d1{animation-delay:.15s}
.hero-in.d2{animation-delay:.35s}
.hero-in.d3{animation-delay:.55s}
.hero-in.d4{animation-delay:.75s}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.amp{color:var(--accent);font-weight:500;font-style:normal;display:inline-block;transform:translateY(-2px)}
.music-btn{position:fixed;bottom:24px;right:24px;z-index:60;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(42,37,32,.12);transition:all .3s ease}
.music-btn:hover{transform:scale(1.05)}
.music-btn.playing{background:rgba(168,102,82,.15)}
.music-bars{display:flex;align-items:flex-end;gap:2px;height:18px}
.music-bars span{width:3px;background:var(--accent);border-radius:2px;transition:height .2s ease}
.music-btn.playing .music-bars span:nth-child(1){animation:bar1 .5s ease-in-out infinite alternate}
.music-btn.playing .music-bars span:nth-child(2){animation:bar2 .4s ease-in-out infinite alternate}
.music-btn.playing .music-bars span:nth-child(3){animation:bar3 .6s ease-in-out infinite alternate}
.music-btn.playing .music-bars span:nth-child(4){animation:bar2 .45s ease-in-out infinite alternate}
@keyframes bar1{0%{height:6px}100%{height:18px}}
@keyframes bar2{0%{height:10px}100%{height:6px}}
@keyframes bar3{0%{height:6px}100%{height:14px}}
.hint-fade{position:fixed;bottom:90px;right:24px;font-size:12px;color:var(--muted);opacity:1;transition:opacity 1s ease;z-index:55}
.hint-fade.gone{opacity:0;pointer-events:none}
.counter-row{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px 6px;margin-bottom:16px}
.counter-unit{min-width:50px;padding:10px 6px 8px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);text-align:center;flex-shrink:0}
.counter-num{font-family:"Cormorant Garamond",serif;font-size:clamp(18px,4vw,26px);font-weight:600;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;transition:transform .25s ease,opacity .25s ease}
.counter-label{font-size:6.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:500}
.counter-sep{align-self:center;font-size:20px;color:var(--accent);opacity:.45;flex-shrink:0}
@media (min-width:640px){
  .counter-unit{min-width:65px;padding:14px 10px 12px}
  .counter-num{font-size:clamp(22px,4vw,32px)}
  .counter-label{font-size:8px;margin-top:6px}
  .counter-sep{font-size:24px}
  .counter-row{gap:12px 8px}
}
</style>
</head>
<body>
<div style="position:relative;background:var(--bg);min-height:100vh;" id="pageWrap">
  <div class="grain"></div>

  <section style="padding:90px 24px 70px;text-align:center;position:relative;overflow:hidden;">
    <div style="position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(168,102,82,.10),transparent 70%);pointer-events:none;"></div>
    <div style="max-width:860px;margin:0 auto;position:relative;">
      <p class="hero-in" style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:500;">Since 06.09.2026</p>
      <h1 class="serif hero-in d1" style="font-size:clamp(44px,8vw,88px);font-weight:500;line-height:1.06;letter-spacing:-.01em;margin:0 0 18px;color:var(--text);">New <span class="amp" style="font-size:0.82em;">&amp;</span> Fahsai</h1>
      <div class="hero-in d2" style="display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 40px;">
        <span style="width:40px;height:1px;background:var(--border);"></span>
        <span style="width:6px;height:6px;border-radius:50%;background:var(--accent);"></span>
        <span style="width:40px;height:1px;background:var(--border);"></span>
      </div>
      <div class="hero-in d3" style="margin-bottom:14px;">
        <span style="font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:500;">We are</span>
      </div>
      <div id="counterRow" class="counter-row hero-in d4"></div>
      <div class="hero-in d4" style="font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:500;">Together</div>
    </div>
  </section>

  <section id="gallerySec" style="padding:40px 24px 90px;max-width:1200px;margin:0 auto;position:relative;z-index:2;">
    <div class="reveal" style="text-align:center;margin-bottom:50px;">
      <p style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;font-weight:500;">Our Gallery</p>
      <div class="divider"></div>
    </div>
    <div id="galleryGrid" style="display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:200px;gap:16px;grid-auto-flow:dense;"></div>
  </section>

  <footer style="padding:50px 24px 44px;text-align:center;border-top:1px solid var(--border);position:relative;z-index:2;">
    <div class="serif" style="font-size:18px;font-weight:600;color:var(--text);letter-spacing:.05em;">New <span class="amp">&amp;</span> Fahsai</div>
  </footer>

  <div id="lightbox" class="lightbox">
    <button id="lbClose" class="lb-btn" style="top:22px;right:22px;border:none;" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button id="lbPrev" class="lb-btn" style="left:20px;top:50%;margin-top:-23px;border:none;" aria-label="Previous">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button id="lbNext" class="lb-btn" style="right:20px;top:50%;margin-top:-23px;border:none;" aria-label="Next">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <img id="lbImg" src="" alt="New & Fahsai" onerror="this.style.display='none'">
    <div style="position:absolute;bottom:24px;color:rgba(255,255,255,.6);font-size:13px;">
      <span id="lbIdx">1/6</span>
    </div>
  </div>

  <audio id="bgMusic" preload="auto" volume="0.3">
  <div id="musicHint" class="hint-fade">กดเพื่อเปิดเพลง 🎵</div>
  <button id="musicBtn" class="music-btn" aria-label="Music">
    <div class="music-bars">
      <span style="height:6px;"></span>
      <span style="height:12px;"></span>
      <span style="height:8px;"></span>
      <span style="height:10px;"></span>
    </div>
  </button>
</div>

<script>
(function(){
  // ===== นับเวลาคบกัน =====
  const start = new Date('2026-09-06T21:19:00+07:00');
  const BKK_OFFSET = 7 * 60;
  const units = [
    {key:'years', label:'Year'},
    {key:'months', label:'Month'},
    {key:'days', label:'Day'},
    {key:'hours', label:'Hour'},
    {key:'mins', label:'Min'},
    {key:'secs', label:'Sec'}
  ];

  const row = document.getElementById('counterRow');
  const els = {};
  units.forEach((u, idx) => {
    if (idx > 0) {
      const sep = document.createElement('span');
      sep.className = 'counter-sep';
      sep.textContent = ':';
      row.appendChild(sep);
    }
    const wrap = document.createElement('div');
    wrap.id = `unit-${u.key}`;
    wrap.className = 'counter-unit';
    const num = document.createElement('div');
    num.className = 'counter-num stat-num';
    num.textContent = '00';
    const lab = document.createElement('div');
    lab.className = 'counter-label';
    lab.textContent = u.label;
    wrap.appendChild(num);
    wrap.appendChild(lab);
    row.appendChild(wrap);
    els[u.key] = num;
  });

  function pad(n) { return n < 10 ? '0' + n : n; }
  function compute() {
    const now = new Date();
    const nb = new Date(now.getTime() + (now.getTimezoneOffset() + BKK_OFFSET) * 60000);
    const sb = new Date(start.getTime() + (start.getTimezoneOffset() + BKK_OFFSET) * 60000);
    let years = nb.getFullYear() - sb.getFullYear();
    let months = nb.getMonth() - sb.getMonth();
    let days = nb.getDate() - sb.getDate();
    let hours = nb.getHours() - sb.getHours();
    let mins = nb.getMinutes() - sb.getMinutes();
    let secs = nb.getSeconds() - sb.getSeconds();
    if (secs < 0) { secs += 60; mins--; }
    if (mins < 0) { mins += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }
    if (days < 0) {
      const prevMonthDays = new Date(nb.getFullYear(), nb.getMonth(), 0).getDate();
      days += prevMonthDays; months--;
    }
    if (months < 0) { months += 12; years--; }
    return {years, months, days, hours, mins, secs};
  }
  function render() {
    const t = compute();
    const yearWrap = document.getElementById('unit-years');
    const seps = row.querySelectorAll('.counter-sep');
    const showYear = t.years > 0;
    yearWrap.style.display = showYear ? '' : 'none';
    if (seps.length > 0) seps[0].style.display = showYear ? '' : 'none';
    els.years.textContent = pad(t.years);
    els.months.textContent = pad(t.months);
    els.days.textContent = pad(t.days);
    els.hours.textContent = pad(t.hours);
    els.mins.textContent = pad(t.mins);
    const newSec = pad(t.secs);
    if (els.secs.textContent !== newSec) {
      els.secs.style.transform = 'translateY(-4px)';
      els.secs.style.opacity = '.4';
      setTimeout(() => { els.secs.style.transform = 'translateY(0)'; els.secs.style.opacity = '1'; }, 150);
      els.secs.textContent = newSec;
    }
  }
  render();
  setInterval(render, 1000);

  // ===== รูปภาพ 6 รูป ตามที่เลือก =====
  let photos = [
    {src:'https://img2.pic.in.th/1000002661.jpg', c:1, r:2},
    {src:'https://img1.pic.in.th/images/1000002559b503d55f6bec15df.jpg', c:1, r:2},
    {src:'https://img2.pic.in.th/1000002699.webp', c:1, r:2},
    {src:'https://img2.pic.in.th/1000002938334a322239e3af60.jpg', c:1, r:1},
    {src:'https://img2.pic.in.th/1000002936.jpg', c:1, r:1},
    {src:'https://img1.pic.in.th/images/1000002937.jpg', c:1, r:1}
  ];

  // สุ่มลำดับรูปทุกครั้งที่เปิด
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  photos = shuffle(photos);

  const grid = document.getElementById('galleryGrid');
  photos.forEach((p, i) => {
    const fig = document.createElement('figure');
    fig.className = 'gallery-item reveal';
    fig.style.gridColumn = `span ${p.c}`;
    fig.style.gridRow = `span ${p.r}`;
    const veil = document.createElement('div');
    veil.className = 'veil';
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = 'New & Fahsai';
    img.loading = 'lazy';
    img.onerror = function() { this.style.opacity = '0.5'; };
    fig.appendChild(img);
    fig.appendChild(veil);
    fig.addEventListener('click', () => openLightbox(i));
    grid.appendChild(fig);
  });

  // ปรับเลย์เอาต์ตามจอ
  function checkGrid() {
    if (window.innerWidth < 640) {
      grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
      grid.style.gridAutoRows = '165px';
    } else if (window.innerWidth < 1024) {
      grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
      grid.style.gridAutoRows = '200px';
    } else {
      grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
      grid.style.gridAutoRows = '220px';
    }
  }
  checkGrid();
  window.addEventListener('resize', checkGrid);
